# SAF Dashboard — self-hosted web UI. Works on Windows, Linux, and macOS.
#
#   cp .env.example .env   # fill in BOT_API_TOKEN + a DASHBOARD_PASSWORD
#   docker compose up -d --build
#   open http://localhost:8090
services:
  saf-dashboard:
    build: .
    image: saf-dashboard:latest
    container_name: saf-dashboard
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:8090"
    environment:
      # Dashboard login (leave blank to run without a password — only do that on
      # a trusted/loopback network).
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"

      # Bearer token for the bot API (from scripts/setup-dashboard-api.sh).
      BOT_API_TOKEN: "${BOT_API_TOKEN:-}"

      # --- Upstream: choose ONE ---
      # A) Direct: the bot API is reachable at this URL (e.g. the dashboard runs
      #    on the same host as the bot, or the bot API is bound to a private net).
      BOT_API_URL: "${BOT_API_URL:-}"
      # B) SSH tunnel: the gateway opens its own tunnel to the bot's loopback API.
      SSH_DEST: "${SSH_DEST:-}"
      SSH_PORT: "${SSH_PORT:-}"
      SSH_KEY: "${SSH_KEY:-}"
      REMOTE_PORT: "${REMOTE_PORT:-8787}"

      # Restart command run on the bot host (over SSH) by POST /api/restart.
      SAF_RESTART_DIR: "${SAF_RESTART_DIR:-/opt/saf}"
      SAF_RESTART_COMMAND: "${SAF_RESTART_COMMAND:-./saf.sh restart}"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8090/healthz', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Mount your SSH key (read-only) when using the SSH tunnel upstream:
    # volumes:
    #   - ${SSH_KEY_HOST:-~/.ssh/id_ed25519}:/keys/id_ed25519:ro
    # To reach a bot bound to the host's loopback with BOT_API_URL, either use
    # host networking (Linux) or http://host.docker.internal:8787 (Docker Desktop).
