[package]
name = "saf-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
discord-webhook = ["saf-discord/webhook-notifier"]
live-cofl = ["saf-cofl/http-client", "saf-cofl/ws-client"]
live-discord = ["dep:serenity", "saf-discord/serenity-controller"]
live-minecraft = ["saf-minecraft/azalea-native"]
api = ["dep:axum"]
production-runtime = ["discord-webhook", "live-cofl", "live-discord", "live-minecraft", "api"]

[[bin]]
name = "saf"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
json5.workspace = true
reqwest.workspace = true
regex.workspace = true
saf-cofl = { path = "../saf-cofl" }
saf-core = { path = "../saf-core" }
saf-discord = { path = "../saf-discord" }
saf-minecraft = { path = "../saf-minecraft" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dependencies.serenity]
version = "0.12"
default-features = false
features = ["cache", "client", "gateway", "http", "model", "rustls_backend"]
optional = true

# Embedded loopback dashboard API (REST + WebSocket). Reached only through an
# SSH tunnel; never bound to a public interface.
[dependencies.axum]
version = "0.8"
default-features = false
features = ["ws", "json", "http1", "tokio", "query"]
optional = true

[dev-dependencies]
tempfile.workspace = true
